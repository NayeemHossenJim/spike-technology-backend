[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spike-backend"
version = "0.4.0"
description = "Spike Technology backend"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Spike Technology" }]
dependencies = [
  "alembic>=1.14,<2.0",
  "asyncer>=0.0.8,<1.0",
  "asyncpg>=0.30,<1.0",
  "boto3>=1.35,<2.0",
  "celery[redis]>=5.4,<6.0",
  "defusedxml>=0.7,<1.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "google-genai>=1.0,<2.0",
  "olefile>=0.47,<0.48",
  "openpyxl>=3.1,<4.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "PyJWT>=2.10,<3.0",
  "redis>=5.2,<7.0",
  "SQLAlchemy>=2.0.36,<2.1",
  "sqlmodel>=0.0.24,<0.1",
  "stripe[async]==14.4.1",
  "uvicorn[standard]>=0.30,<1.0",
  "xlrd>=2.0,<3.0",
]

[project.optional-dependencies]
phase2 = [
  "pandas>=2.2,<4.0",
]
phase3 = [
  "weasyprint>=66.0,<70.0",
]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.0,<2.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
  "integration: requires PostgreSQL and Redis started by Docker Compose",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
